<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CESARXRAT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Full screen loading video */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loadingScreen video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #loadingScreen .spinner {
            position: relative;
            z-index: 10;
            border: 6px solid #1a1a4e;
            border-top: 6px solid #4a9eff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        #loadingScreen h1 {
            position: relative;
            z-index: 10;
            color: #4a9eff;
            text-shadow: 0 0 30px rgba(74,158,255,0.7);
        }
        #videoScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0b2a;
            z-index: 9998;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #videoScreen video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        #videoScreen .btn-secondary {
            position: absolute;
            bottom: 40px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            border: 2px solid #4a9eff;
            color: #4a9eff;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        /* MAIN MENU - POSISI TENGAH SEMPURNA */
        #mainMenu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            background: #0b0b2a;
            padding: 20px;
            box-sizing: border-box;
        }
        #mainMenu .card {
            max-width: 400px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(145deg, #12123a, #1a1a4e);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 255, 0.3);
            border: 1px solid #2a2a7a;
            margin: auto;
        }
        /* LOGO KOTAK DENGAN BINGKAI */
        #mainMenu .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border: 4px solid #4a9eff;
            border-radius: 15px;
            background: #0b0b2a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.3);
        }
        #mainMenu .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }
        #mainMenu .logo .logo-text {
            font-size: 28px;
            font-weight: bold;
            color: #4a9eff;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
            letter-spacing: 2px;
        }
        #mainMenu h1 {
            font-size: 32px;
            margin-bottom: 5px;
            color: #4a9eff;
        }
        #mainMenu p {
            color: #8899dd;
            margin-bottom: 30px;
            font-size: 16px;
        }
        #mainMenu .btn-primary {
            width: 80%;
            margin: 0 auto;
        }
        #mainMenu .btn-secondary {
            width: 80%;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Override style.css untuk tombol di sini */
        .btn-primary {
            display: block;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #4a9eff, #1a5bbf);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(74, 158, 255, 0.4);
            text-align: center;
            text-decoration: none;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(74, 158, 255, 0.6);
        }
        .btn-secondary {
            display: block;
            padding: 14px;
            border: 2px solid #4a9eff;
            background: transparent;
            color: #4a9eff;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: #4a9eff;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- LOADING FULL SCREEN -->
    <div id="loadingScreen">
        <video autoplay muted loop>
            <source src="video/loading.mp4" type="video/mp4">
        </video>
        <div class="spinner"></div>
        <h1>CESARXRAT</h1>
    </div>

    <!-- VIDEO FULL SCREEN (anime) dengan SKIP -->
    <div id="videoScreen">
        <video id="animeVideo" autoplay muted>
            <source src="video/loading.mp4" type="video/mp4">
        </video>
        <button class="btn-secondary" onclick="skipVideo()">SKIP</button>
    </div>

    <!-- MAIN MENU dengan LOGO KOTAK + BINGKAI & POSISI TENGAH -->
    <div id="mainMenu">
        <div class="card">
            <!-- LOGO KOTAK DENGAN BINGKAI -->
            <div class="logo">
                <img src="img/logo.jpg" alt="Logo CESARXRAT" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'logo-text\'>CR</span>';">
            </div>
            <h1>CESARXRAT</h1>
            <p>Panel Controller</p>
            <button class="btn-primary" onclick="location.href='login.html'">MASUK</button>
            <div style="height:12px;"></div>
            <button class="btn-secondary" onclick="location.href='register.html'">DAFTAR</button>
        </div>
    </div>

    <script>
        // Setelah loading 3 detik, tampilkan video full screen
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('videoScreen').style.display = 'flex';
            document.getElementById('animeVideo').play();
        }, 3000);

        function skipVideo() {
            document.getElementById('videoScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
        }
        document.getElementById('animeVideo').addEventListener('ended', skipVideo);
    </script>

</body>
</html>
