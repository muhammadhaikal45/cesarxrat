<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat - CESARXRAT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #0a0e27; color: #e0e8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: block; min-height: 100vh;
        }
        .chat-container {
            max-width: 480px; margin: auto; padding: 16px;
            display: flex; flex-direction: column;
            height: 100vh; box-sizing: border-box;
        }
        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 2px solid #2a4a8a;
        }
        .chat-header h1 { font-size: 24px; color: #4a9eff; margin: 0; }
        .chat-header .back-btn {
            color: #4a9eff; cursor: pointer; font-size: 16px;
            font-weight: bold; background: transparent;
            border: 2px solid #4a9eff; padding: 6px 16px;
            border-radius: 50px; transition: 0.3s;
        }
        .chat-header .back-btn:hover { background: #4a9eff; color: #fff; }
        .chat-messages {
            flex: 1; overflow-y: auto; background: #111a3a;
            border-radius: 16px; padding: 14px;
            border: 1px solid #2a4a8a; margin-bottom: 12px;
            max-height: 70vh;
        }
        .chat-messages .message {
            padding: 8px 12px; margin-bottom: 6px;
            border-radius: 12px; background: #0e1635;
            border-left: 4px solid #4a9eff; word-wrap: break-word;
        }
        .chat-messages .message .sender {
            font-weight: bold; color: #4a9eff; font-size: 14px;
        }
        .chat-messages .message .time {
            font-size: 10px; color: #6a8abf; margin-left: 8px;
        }
        .chat-messages .message .text {
            font-size: 15px; color: #c0d8ff; margin-top: 2px;
        }
        .chat-messages .message.self {
            border-left-color: #4ae0a0; background: #0e1a2e;
        }
        .chat-messages .message.self .sender { color: #4ae0a0; }
        .chat-input-area {
            display: flex; gap: 10px; background: #111a3a;
            padding: 10px 12px; border-radius: 50px;
            border: 1px solid #2a4a8a;
        }
        .chat-input-area input {
            flex: 1; background: transparent; border: none;
            color: #e0e8ff; font-size: 16px; outline: none; padding: 8px 4px;
        }
        .chat-input-area input::placeholder { color: #6a8abf; }
        .chat-input-area button {
            background: linear-gradient(135deg, #4a9eff, #1a5bbf);
            border: none; color: #fff; padding: 8px 20px;
            border-radius: 50px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(74, 158, 255, 0.3);
        }
        .chat-input-area button:hover { transform: scale(1.03); }
        .chat-info {
            text-align: center; font-size: 12px;
            color: #6a8abf; margin-top: 6px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: #0a0e27; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #4a9eff; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>💬 Global Chat</h1>
            <button class="back-btn" onclick="history.back()">Kembali</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ketik pesan..." autofocus maxlength="200">
            <button id="sendBtn">Kirim</button>
        </div>
        <div class="chat-info">💡 Pesan real-time dari semua pengguna</div>
    </div>

    <script type="module">
        import { db, ref, onValue, push } from './firebase-config.js';

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';

        const username = user.username || 'guest';
        const role = user.role || 'buyer';
        const senderName = role === 'admin' ? 'admin' : username;

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text === '') { input.focus(); return; }

            if (text.length > 200) {
                alert('Pesan maksimal 200 karakter!');
                return;
            }

            const messagesRef = ref(db, 'chat/messages');
            push(messagesRef, {
                sender: senderName,
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
            input.focus();
        }

        const messagesRef = ref(db, 'chat/messages');
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('chatMessages');

            if (!data) {
                container.innerHTML = '<div style="text-align:center;color:#6a8abf;padding:30px 0;">Belum ada pesan. Mulai obrolan!</div>';
                return;
            }

            const messages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
            let html = '';
            messages.forEach(function(msg) {
                const isSelf = (msg.sender === senderName);
                const selfClass = isSelf ? 'self' : '';
                const senderDisplay = isSelf ? 'Anda' : msg.sender;
                const timeStr = new Date(msg.timestamp).toLocaleTimeString('id-ID', {
                    hour: '2-digit', minute: '2-digit'
                });

                html += `
                    <div class="message ${selfClass}">
                        <div class="sender">${escapeHtml(senderDisplay)} <span class="time">${timeStr}</span></div>
                        <div class="text">${escapeHtml(msg.text)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });

        document.getElementById('chatInput').focus();
        console.log('[CESARXRAT] Global Chat real-time aktif');
    </script>
</body>
</html>
