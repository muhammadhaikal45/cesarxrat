<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CESARXRAT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #e0e8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: block; min-height: 100vh;
        }
        .dash-container { max-width: 480px; margin: auto; padding: 16px; }
        .dash-header {
            display: flex; align-items: center; justify-content: center;
            position: relative; margin-bottom: 16px; padding: 12px 0;
        }
        .menu-toggle {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            font-size: 32px; cursor: pointer; color: #4a9eff;
            transition: 0.2s; background: rgba(74, 158, 255, 0.1);
            padding: 6px 12px; border-radius: 12px;
            border: 1px solid rgba(74, 158, 255, 0.2);
        }
        .menu-toggle:hover { background: rgba(74, 158, 255, 0.2); color: #7bb8ff; }
        .dash-title {
            font-size: 30px; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #4a9eff 0%, #1a5bbf 40%, #4a9eff 70%, #7bb8ff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(74, 158, 255, 0.3);
            animation: gradienBergerak 4s ease-in-out infinite alternate;
            position: relative; display: inline-block;
        }
        @keyframes gradienBergerak {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .video-wrapper {
            border-radius: 20px; overflow: hidden; margin: 12px 0 16px 0;
            border: 2px solid #2a4a8a;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.15);
        }
        .video-wrapper video { width: 100%; display: block; pointer-events: none; user-select: none; }
        .welcome-card {
            background: linear-gradient(145deg, #111a3a, #1a2a5a);
            border-radius: 20px; padding: 20px; border: 1px solid #2a4a8a;
            box-shadow: 0 8px 25px rgba(74, 158, 255, 0.2);
        }
        .welcome-card .greeting { font-size: 22px; font-weight: bold; color: #c0d8ff; }
        .welcome-card .greeting small {
            display: block; font-size: 14px; color: #7a9edd; font-weight: normal;
        }
        .role-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4a9eff, #1a6bbf);
            color: #fff; padding: 4px 18px; border-radius: 50px;
            font-size: 12px; font-weight: bold; margin-top: 6px;
            letter-spacing: 0.5px; box-shadow: 0 0 15px rgba(74, 158, 255, 0.3);
        }
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
        }
        .info-item {
            background: #0e1635; border-radius: 14px; padding: 10px 12px;
            border: 1px solid #1a3a6a; transition: 0.2s;
        }
        .info-item:hover { border-color: #4a9eff; box-shadow: 0 0 15px rgba(74, 158, 255, 0.1); }
        .info-item .label {
            font-size: 11px; color: #6a8abf; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item .value { font-size: 15px; font-weight: 600; color: #b0c8ff; margin-top: 2px; }
        .stats-row { display: flex; gap: 12px; margin: 16px 0; }
        .stat-box {
            flex: 1; background: #111a3a; border-radius: 16px; padding: 14px;
            text-align: center; border: 1px solid #2a4a8a; transition: 0.2s;
        }
        .stat-box:hover { border-color: #4a9eff; box-shadow: 0 0 20px rgba(74, 158, 255, 0.1); }
        .stat-box .number {
            font-size: 24px; font-weight: bold; color: #4a9eff;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }
        .stat-box .desc {
            font-size: 11px; color: #6a8abf; text-transform: uppercase;
            letter-spacing: 0.5px; margin-top: 2px;
        }
        .expiration-box {
            background: #111a3a; border-radius: 16px; padding: 14px 18px;
            border: 1px solid #2a4a8a; display: flex;
            justify-content: space-between; align-items: center;
            margin-top: 12px; transition: 0.2s;
        }
        .expiration-box:hover { border-color: #4a9eff; }
        .expiration-box .label { font-size: 13px; color: #6a8abf; }
        .expiration-box .value { font-size: 16px; font-weight: bold; color: #4ae0a0; }
        .btn-buy {
            background: linear-gradient(135deg, #4a9eff, #1a5bbf);
            border: none; color: #fff; padding: 6px 18px;
            border-radius: 50px; font-size: 12px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
        }
        .btn-buy:hover { transform: scale(1.05); }
        .dash-actions { display: flex; gap: 12px; margin: 16px 0; }
        .dash-actions .btn-primary {
            flex: 1; padding: 14px; border: none; border-radius: 50px;
            background: linear-gradient(135deg, #4a9eff, #1a5bbf);
            color: #fff; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 6px 20px rgba(74, 158, 255, 0.25);
            text-align: center;
        }
        .dash-actions .btn-primary:hover { transform: scale(1.02); }
        .side-menu {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: #0a0e27; padding: 30px 20px; transition: 0.4s;
            z-index: 999; border-right: 2px solid #2a4a8a;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.8);
        }
        .side-menu.active { left: 0; }
        .side-menu .close-btn { text-align: right; font-size: 28px; cursor: pointer; color: #4a9eff; }
        .side-menu .menu-item {
            padding: 16px 0; border-bottom: 1px solid #1a2a5a;
            font-size: 18px; cursor: pointer; transition: 0.2s; color: #b0c8ff;
        }
        .side-menu .menu-item:hover { color: #4a9eff; padding-left: 10px; }
        .side-menu .menu-item.logout { color: #ff6b6b; }
        @media (max-width: 400px) {
            .dash-title { font-size: 24px; }
            .welcome-card .greeting { font-size: 18px; }
            .info-item .value { font-size: 13px; }
            .stat-box .number { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="dash-container">
        <div class="dash-header">
            <span class="menu-toggle" onclick="toggleSideMenu()">☰</span>
            <span class="dash-title">CESARXRAT</span>
        </div>

        <div class="video-wrapper">
            <video id="dashVideo" autoplay muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback">
                <source src="video/anime.mp4" type="video/mp4">
            </video>
        </div>

        <div class="welcome-card">
            <div class="greeting">
                Welcome Back, <span id="userName">ikel</span>
                <small id="userRole">BUYER</small>
            </div>
            <span class="role-badge" id="roleBadge">BUYER</span>

            <div class="info-grid">
                <div class="info-item">
                    <div class="label">📱 Device</div>
                    <div class="value" id="deviceName">Memuat...</div>
                </div>
                <div class="info-item">
                    <div class="label">🔋 Battery</div>
                    <div class="value" id="batteryLevel">Memuat...</div>
                </div>
                <div class="info-item">
                    <div class="label">💾 Internal</div>
                    <div class="value" id="internalStorage">Memuat...</div>
                </div>
                <div class="info-item">
                    <div class="label">🌐 Jaringan</div>
                    <div class="value" id="networkType">Memuat...</div>
                </div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="number" id="onlineUsers">0</div>
                <div class="desc">Online Users</div>
            </div>
            <div class="stat-box">
                <div class="number" id="activeConnections">0</div>
                <div class="desc">Active Connections</div>
            </div>
        </div>

        <div class="expiration-box">
            <div>
                <div class="label">⏳ Expiration</div>
                <div class="value" id="expirationDate">99999-09-9</div>
            </div>
            <button class="btn-buy" onclick="alert('Pilih paket:\n15k - 1 bulan\n100k - 1 tahun')">Buy License</button>
        </div>

        <div class="dash-actions">
            <button class="btn-primary" onclick="location.href='rat-control.html'">🔘 RAT Control</button>
            <button class="btn-primary" onclick="location.href='device-target.html'">📱 Device Target</button>
        </div>

        <div id="sideMenu" class="side-menu">
            <div class="close-btn" onclick="toggleSideMenu()">✕</div>
            <div class="menu-item" onclick="location.href='settings.html'">⚙️ Setting Akun</div>
            <div class="menu-item" onclick="location.href='global-chat.html'">💬 Global Chat</div>
            <div class="menu-item" onclick="location.href='info.html'">ℹ️ Informasi</div>
            <div class="menu-item" onclick="location.href='donasi.html'">❤️ Donasi</div>
            <div class="menu-item logout" onclick="logout()">🚪 Logout</div>
        </div>
    </div>

    <script type="module">
        import { db, ref, onValue, set, onDisconnect, serverTimestamp } from './firebase-config.js';

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';

        document.getElementById('userName').textContent = user.username || 'ikel';
        document.getElementById('userRole').textContent = (user.role || 'buyer').toUpperCase();
        document.getElementById('roleBadge').textContent = (user.role || 'buyer').toUpperCase();

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (ua.includes('iPhone')) return 'iPhone';
            if (ua.includes('iPad')) return 'iPad';
            if (ua.includes('Android')) {
                const match = ua.match(/Android\s([\d.]+)/);
                return 'Android ' + (match ? match[1] : '');
            }
            if (ua.includes('Windows')) return 'Windows PC';
            if (ua.includes('Mac')) return 'Mac';
            return 'Perangkat Tidak Dikenal';
        }

        function getBatteryLevel(callback) {
            if (navigator.getBattery) {
                navigator.getBattery().then(function(battery) {
                    const level = Math.round(battery.level * 100);
                    callback(level + '%');
                }).catch(function() { callback('Tidak Tersedia'); });
            } else { callback('Tidak Tersedia'); }
        }

        function getInternalStorage(callback) {
            if (navigator.storage && navigator.storage.estimate) {
                navigator.storage.estimate().then(function(estimate) {
                    const total = estimate.quota;
                    const used = estimate.usage;
                    const totalGB = (total / (1024 * 1024 * 1024)).toFixed(1);
                    const usedGB = (used / (1024 * 1024 * 1024)).toFixed(1);
                    callback(usedGB + 'GB / ' + totalGB + 'GB');
                }).catch(function() { callback('Tidak Tersedia'); });
            } else { callback('Tidak Tersedia'); }
        }

        function getNetworkType() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (connection) {
                const type = connection.effectiveType;
                if (type === 'wifi') return '📶 WiFi';
                if (type === 'cellular') return '📶 Data Seluler';
                if (type === 'ethernet') return '📶 Kabel';
                if (type === 'none') return '📶 Offline';
                return '📶 ' + type.toUpperCase();
            }
            return '📶 Tidak Diketahui';
        }

        function updateDeviceInfo() {
            document.getElementById('deviceName').textContent = getDeviceName();
            document.getElementById('networkType').textContent = getNetworkType();
            getBatteryLevel(function(level) {
                document.getElementById('batteryLevel').textContent = level;
            });
            getInternalStorage(function(storage) {
                document.getElementById('internalStorage').textContent = storage;
            });
        }

        updateDeviceInfo();
        setInterval(updateDeviceInfo, 30000);

        const SESSION_ID = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const username = user.username || 'guest';
        const role = user.role || 'buyer';

        const userRef = ref(db, 'online/' + SESSION_ID);
        set(userRef, {
            username: username,
            role: role,
            timestamp: serverTimestamp()
        });
        onDisconnect(userRef).remove();

        const onlineRef = ref(db, 'online');
        onValue(onlineRef, (snapshot) => {
            const data = snapshot.val();
            const onlineCount = data ? Object.keys(data).length : 0;
            document.getElementById('onlineUsers').textContent = onlineCount;
            document.getElementById('activeConnections').textContent = onlineCount + 1;
        });

        document.getElementById('expirationDate').textContent = '99999-09-9';

        window.toggleSideMenu = function() {
            document.getElementById('sideMenu').classList.toggle('active');
        };

        window.logout = function() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        };

        const video = document.getElementById('dashVideo');
        video.addEventListener('pause', function() { video.play(); });
        video.addEventListener('click', function(e) { e.preventDefault(); video.play(); });
        video.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        console.log('[CESARXRAT] Dashboard real-time aktif');
    </script>
</body>
</html>
