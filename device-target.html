<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Target</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:block;padding:20px;">
    <div style="max-width:480px;margin:auto;">
        <h1 style="text-align:left;">Device Target</h1>
        <div class="device-item">
            <div><span style="font-weight:bold;">Xiaomi 9C</span> <span class="status-online">● Online</span></div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>
        <div class="device-item">
            <div><span style="font-weight:bold;">Samsung A32</span> <span class="status-offline">● Offline</span></div>
            <label class="switch"><input type="checkbox" disabled><span class="slider"></span></label>
        </div>
        <button class="btn-secondary" style="width:100%;margin-top:20px;" onclick="history.back()">Kembali</button>
    </div>
</body>
</html>
